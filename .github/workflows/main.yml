name: Main
on:
  push:
jobs:
  build:
    name: 'Go Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        run: sh ./scripts/download-go-modules.sh
      - name: "Install libheif"
        run: "chmod +x ./.github/workflows/build-libheif.sh && ./.github/workflows/build-libheif.sh"
      - run: './build.sh' # verify the thing compiles
  static:
    name: 'Go Static'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        run: sh ./scripts/download-go-modules.sh
      - name: "Install libheif"
        run: "chmod +x ./.github/workflows/build-libheif.sh && ./.github/workflows/build-libheif.sh"
      - name: "Prepare: compile assets"
        run: "GOBIN=$PWD/bin go install -v ./cmd/utilities/compile_assets"
      - name: "Run: compile assets"
        run: "$PWD/bin/compile_assets"
      - name: "Prepare: staticcheck"
        env:
          GODEBUG: http2client=0
        run: 'go install honnef.co/go/tools/cmd/staticcheck@latest'
      - run: 'go vet ./cmd/...'
      - run: 'staticcheck ./cmd/...'
  test:
    name: 'Go Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Download Go modules
        run: sh ./scripts/download-go-modules.sh
      - name: "Prepare: compile assets"
        run: "GOBIN=$PWD/bin go install -v ./cmd/utilities/compile_assets"
      - name: "Run: compile assets"
        run: "$PWD/bin/compile_assets"
      - name: "Run: tests"
        run: |
          go test -v ./common/config ./api/_routers ./pipelines/pipeline_download
          go test -c -v ./test
          ./test.test '-test.v' -test.parallel 1
        timeout-minutes: 30
